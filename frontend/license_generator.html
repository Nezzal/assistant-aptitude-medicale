<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Licences & Facturation - PedagogiAfrica</title>
    <style>
        :root {
            --bg-base: #0b132b;
            --bg-surface: rgba(28, 37, 65, 0.65);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --success: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-heading: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        .glass-card {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header-title-box {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 1.9rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
            font-family: var(--font-body);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        select.form-input {
            cursor: pointer;
            background-color: #16203c;
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: #0b132b;
            border: none;
            padding: 0.85rem 1.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition-smooth);
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        .key-display {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 230, 118, 0.05);
            color: var(--success);
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px dashed var(--success);
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .copy-btn-link {
            font-size: 0.8rem;
            color: var(--success);
            cursor: pointer;
            text-decoration: underline;
            background: transparent;
            border: none;
            font-family: var(--font-body);
            font-weight: 600;
        }

        .email-template {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            line-height: 1.45;
            max-height: 150px;
            overflow-y: auto;
        }

        .action-row {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-action {
            flex: 1;
            padding: 0.75rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .btn-action-primary {
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
            border-color: rgba(0, 230, 118, 0.3);
        }

        .btn-action-primary:hover {
            background: rgba(0, 230, 118, 0.25);
        }

        .btn-action-secondary {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .btn-action-secondary:hover {
            background: rgba(0, 242, 254, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="header-title-box">
                <h1>PedagogiAfrica</h1>
                <div class="subtitle">Générateur Officiel de Licences & Facturation</div>
            </div>

            <div class="input-group">
                <label for="machine-id-input">Identifiant Machine unique (Machine ID) :</label>
                <input type="text" id="machine-id-input" placeholder="Ex: MED-ABCD-EFGH" class="form-input" autocomplete="off" style="text-transform: uppercase; font-family: monospace;">
            </div>

            <!-- Paramètres de facturation optionnels -->
            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); text-align: left;">
                <label style="color: var(--primary); font-size: 0.85rem; margin-bottom: 1rem; display: block; font-weight: 700; text-transform: none;">📄 Options de Facturation Client (Facultatif)</label>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="doctor-name-input">Nom complet du Médecin :</label>
                        <input type="text" id="doctor-name-input" placeholder="Ex: Dr. Benali Mohamed" class="form-input">
                    </div>
                    
                    <div class="input-group">
                        <label for="doctor-structure-input">Structure / Cabinet :</label>
                        <input type="text" id="doctor-structure-input" placeholder="Ex: EPH Rouiba, CMT..." class="form-input">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="client-nif-input">NIF du Client (Structure/Clinique) :</label>
                        <input type="text" id="client-nif-input" placeholder="Numéro d'Identification Fiscale" class="form-input">
                    </div>

                    <div class="input-group">
                        <label for="plan-select-input">Formule / Tarif :</label>
                        <select id="plan-select-input" class="form-input">
                            <option value="lifetime">Licence Permanente (À vie) - 5 000 DA</option>
                            <option value="annual">Abonnement Annuel - 3 000 DA</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="btn-generate" class="btn">Générer la Clé & la Facture</button>

            <!-- Résultats -->
            <div id="result-container" class="result-box">
                <label>Clé d'activation générée :</label>
                <div class="key-display">
                    <span id="output-key">ACT-XXXX-XXXX</span>
                    <button id="btn-copy-key" class="copy-btn-link">Copier</button>
                </div>

                <div class="input-group">
                    <label style="display: flex; justify-content: space-between;">
                        <span>Modèle de réponse e-mail :</span>
                        <button id="btn-copy-email" class="copy-btn-link" style="color: var(--secondary)">Copier</button>
                    </label>
                    <div class="email-template" id="email-body"></div>
                </div>

                <!-- Actions de facturation -->
                <div class="action-row" id="billing-actions" style="display: none;">
                    <button class="btn-action btn-action-primary" id="btn-print-invoice">
                        🖨️ Imprimer la Facture Acquittée
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const machineIdInput = document.getElementById("machine-id-input");
            const doctorNameInput = document.getElementById("doctor-name-input");
            const doctorStructureInput = document.getElementById("doctor-structure-input");
            const clientNifInput = document.getElementById("client-nif-input");
            const planSelectInput = document.getElementById("plan-select-input");

            const btnGenerate = document.getElementById("btn-generate");
            const resultContainer = document.getElementById("result-container");
            const outputKey = document.getElementById("output-key");
            const btnCopyKey = document.getElementById("btn-copy-key");
            const btnCopyEmail = document.getElementById("btn-copy-email");
            const emailBody = document.getElementById("email-body");
            const billingActions = document.getElementById("billing-actions");
            const btnPrintInvoice = document.getElementById("btn-print-invoice");

            let generatedData = null;

            function generateActivationKey(macId) {
                // Algorithme identique à celui du frontend
                const salt = "PedagogiAfrica2026SecretSalt";
                const input = macId + salt;
                let hash = 5381;
                for (let i = 0; i < input.length; i++) {
                    hash = ((hash << 5) + hash) + input.charCodeAt(i);
                }
                const absHash = Math.abs(hash).toString(16).toUpperCase();
                let padded = absHash.padEnd(8, "A");
                const p1 = padded.substring(0, 4);
                const p2 = padded.substring(4, 8);
                return `ACT-${p1}-${p2}`;
            }

            btnGenerate.addEventListener("click", () => {
                const macId = machineIdInput.value.trim().toUpperCase();
                if (!macId || !macId.startsWith("MED-")) {
                    alert("Veuillez saisir un Identifiant Machine valide (commençant par MED-).");
                    return;
                }

                const key = generateActivationKey(macId);
                outputKey.textContent = key;

                // Capturer les données de facturation
                const docName = doctorNameInput.value.trim();
                const structure = doctorStructureInput.value.trim();
                const clientNif = clientNifInput.value.trim();
                const planValue = planSelectInput.value;

                // Préparer le modèle d'email
                let responseText = `Bonjour,\n\nNous avons bien reçu votre virement BaridiMob et nous vous en remercions.\n\nVoici votre clé d'activation personnalisée pour votre ordinateur :\n👉  ${key}\n\nCopiez cette clé et collez-la dans le champ d'activation de votre application pour démarrer l'assistant.`;
                
                if (docName) {
                    responseText += `\n\nVous trouverez en pièce jointe de ce courriel votre facture acquittée au format PDF.`;
                }
                
                responseText += `\n\nCordialement,\nL'équipe PedagogiAfrica`;
                emailBody.textContent = responseText;

                // Enregistrer les données générées
                generatedData = {
                    key: key,
                    machineId: macId,
                    docName: docName || "Chercheur / Médecin",
                    structure: structure || "Cabinet de Médecine du Travail",
                    clientNif: clientNif || "",
                    plan: planValue,
                    invoiceNumber: `FAC-AMED-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`,
                    dateText: new Date().toLocaleDateString("fr-FR", {day: "2-digit", month: "2-digit", year: "numeric"})
                };

                resultContainer.style.display = "block";
                
                // Afficher le bouton d'impression de la facture uniquement si un nom de médecin a été saisi
                if (docName) {
                    billingActions.style.display = "flex";
                } else {
                    billingActions.style.display = "none";
                }
            });

            btnCopyKey.addEventListener("click", () => {
                navigator.clipboard.writeText(outputKey.textContent);
                alert("Clé d'activation copiée !");
            });

            btnCopyEmail.addEventListener("click", () => {
                navigator.clipboard.writeText(emailBody.textContent);
                alert("Modèle d'e-mail copié !");
            });

            btnPrintInvoice.addEventListener("click", () => {
                if (!generatedData) return;

                const t = window.open("", "_blank", "width=900,height=950");
                if (!t) {
                    alert("Veuillez autoriser les fenêtres surgissantes (pop-ups) pour imprimer la facture.");
                    return;
                }

                const priceText = generatedData.plan === "lifetime" ? "5 000 DZD" : "3 000 DZD";
                const planDescription = generatedData.plan === "lifetime" 
                    ? "Licence Permanente locale de bureau (À vie, sans abonnement)" 
                    : "Abonnement Annuel à la plateforme en ligne (12 mois)";
                const planText = generatedData.plan === "lifetime" ? "Permanente à vie" : "Annuelle (12 mois)";

                const htmlContent = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Facture Acquittée ${generatedData.invoiceNumber} — Assistant Aptitude Médicale</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; margin: 30px; line-height: 1.5; font-size: 14px; }
        .invoice-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00f2fe; padding-bottom: 20px; margin-bottom: 30px; }
        .logo-title { display: flex; align-items: center; gap: 12px; }
        .logo-title img { height: 50px; border-radius: 4px; }
        .app-name { font-size: 20px; font-weight: bold; color: #1a365d; }
        .publisher-info { font-size: 12px; color: #555; text-align: right; }
        .invoice-title { font-size: 24px; font-weight: bold; color: #2d3748; margin-bottom: 5px; }
        .invoice-meta { font-size: 13px; color: #718096; }
        .billing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .billing-section { background: #f7fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .billing-section h3 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #4a5568; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px; margin-bottom: 10px; }
        .billing-section p { margin: 5px 0; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        .invoice-table th { background: #edf2f7; text-align: left; padding: 12px; border-bottom: 2px solid #cbd5e0; font-weight: 700; color: #4a5568; }
        .invoice-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .invoice-total { text-align: right; font-size: 18px; font-weight: bold; color: #1a365d; margin-top: 20px; padding-top: 10px; border-top: 2px solid #cbd5e0; }
        .badge-paid { display: inline-block; background: #c6f6d5; color: #22543d; font-weight: bold; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
        .invoice-footer { border-top: 1px dashed #cbd5e0; padding-top: 20px; font-size: 11px; color: #718096; text-align: center; margin-top: 50px; }
        .license-box { background: #fffaf0; border: 1px dashed #dd6b20; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 14px; color: #cbd5e0; text-align: center; margin-top: 15px; font-weight: bold; }
        @media print {
            body { margin: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="invoice-header">
        <div class="logo-title">
            <img src="logo.png" alt="PedagogiAfrica Logo" style="height: 50px; border-radius: 4px; object-fit: contain;" onerror="this.style.display='none'">
            <div>
                <span class="app-name">Assistant d'Aptitude Médicale</span><br>
                <span style="font-size: 11px; color: #718096;">Solution autonome &amp; privée d'aide à la décision pour la médecine du travail</span>
            </div>
        </div>
        <div class="publisher-info">
            <strong>Éditeur :</strong> Pr. Nezzal Abdelmalek / PedagogiAfrica<br>
            <strong>NIF Éditeur :</strong> 15007180115910202380<br>
            <strong>RIP BaridiMob :</strong> 00799999002345678990<br>
            <strong>E-mail :</strong> pedagogiafrica@gmail.com
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
        <div>
            <div class="invoice-title">Facture Acquittée</div>
            <div class="invoice-meta">
                N° Facture : ${generatedData.invoiceNumber}<br>
                Date de règlement : ${generatedData.dateText}
            </div>
        </div>
        <div class="badge-paid">✓ Règlement BaridiMob validé</div>
    </div>

    <div class="billing-grid">
        <div class="billing-section">
            <h3>Bénéficiaire / Client</h3>
            <p><strong>Nom complet :</strong> ${generatedData.docName}</p>
            <p><strong>Structure / Cabinet :</strong> ${generatedData.structure}</p>
            ${generatedData.clientNif ? `<p><strong>NIF Client :</strong> ${generatedData.clientNif}</p>` : ''}
        </div>
        <div class="billing-section">
            <h3>Détails techniques de licence</h3>
            <p><strong>Identifiant Machine :</strong> ${generatedData.machineId}</p>
            <p><strong>Formule :</strong> ${planText}</p>
        </div>
    </div>

    <table class="invoice-table">
        <thead>
            <tr>
                <th style="width: 60%;">Description du logiciel / Prestation</th>
                <th style="width: 20%; text-align: right;">Tarif de base</th>
                <th style="width: 20%; text-align: right;">Montant Réglé</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <strong>Licence d'utilisation du logiciel "Assistant d'Aptitude Médicale"</strong><br>
                    <span style="font-size: 12px; color: #718096;">Option : ${planDescription} - Machine ID : ${generatedData.machineId}</span>
                    <div style="background: #f7fafc; border: 1px dashed #cbd5e0; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #2b6cb0; text-align: center; margin-top: 15px; font-weight: bold;">
                        🔑 Clé de licence : ${generatedData.key}
                    </div>
                </td>
                <td style="text-align: right; font-weight: 500;">${priceText}</td>
                <td style="text-align: right; font-weight: bold; color: #2b6cb0;">${priceText}</td>
            </tr>
        </tbody>
    </table>

    <div class="invoice-total">
        Montant total TTC perçu : ${priceText}
    </div>

    <div style="margin-top: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
        <div style="font-size: 11px; color: #718096; max-width: 380px; line-height: 1.4;">
            * Ce document atteste de la réception définitive des fonds via le virement postal BaridiMob et tient lieu de quittance définitive de livraison de clé logicielle.
        </div>
        <div style="text-align: center; width: 220px;">
            <p style="font-size: 12px; margin-bottom: 55px; font-weight: bold; color: #4a5568;">Signature &amp; Cachet de l'éditeur</p>
            <div style="border-top: 1px solid #cbd5e0; width: 100%;"></div>
        </div>
    </div>

    <div class="invoice-footer">
        © 2026 PedagogiAfrica - Pr. Nezzal Abdelmalek. Tous droits réservés.
    </div>

    <div class="no-print" style="margin-top: 30px; text-align: center;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 14px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">🖨️ Imprimer la Facture (ou Sauvegarder en PDF)</button>
    </div>
</body>
</html>`;

                t.document.write(htmlContent);
                t.document.close();
                t.focus();
            });
        });
    </script>
</body>
</html>
