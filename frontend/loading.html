<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement...</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(79, 172, 254, 0.15) 0%, transparent 80%);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00f2fe;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 500;
            font-size: 1.25rem;
            margin: 0;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Démarrage de l'assistant d'aptitude...</h2>
</body>
</html>
